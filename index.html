<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Un recorrido cinematográfico por ocho lugares de la historia de Plasencia.">
  <title>Plasencia · Historia viva</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/f9.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/editorial.css">
  <link rel="stylesheet" href="css/reescritura.css">
  <script defer src="vendor/gsap.min.js"></script>
  <script defer src="vendor/ScrollTrigger.min.js"></script>
  <script type="module" src="js/modelos/reescritura.js"></script>
</head>
<body class="model-page rewrite-page is-static" data-model="reescritura">
  <a class="skip-link" href="#story-root">Saltar al recorrido</a>

  <header class="site-header cinema-header">
    <a class="brand" href="#inicio" aria-label="Ir al inicio"><span>PLASENCIA</span><small>Historia viva</small></a>
    <p class="edition-label">PIEDRA · AGUA · TIEMPO</p>
    <div class="header-actions">
      <button class="text-button" id="motion-toggle" type="button" aria-pressed="false">Modo lectura</button>
      <button class="text-button" id="chapters-open" type="button">Capítulos <span aria-hidden="true">＋</span></button>
    </div>
  </header>

  <main>
    <section class="cinema-hero" id="inicio" aria-labelledby="cover-title">
      <div class="cinema-hero-frame">
        <figure class="cinema-hero-image" aria-hidden="true">
          <img src="assets/base-4k.png" alt="" width="3840" height="2160" fetchpriority="high">
        </figure>
        <div class="cinema-hero-shade" aria-hidden="true"></div>
        <div class="cinema-hero-copy">
          <p class="cinema-kicker">PLASENCIA · EXTREMADURA</p>
          <h1 id="cover-title"><span>La ciudad</span><em>escrita en capas.</em></h1>
          <p class="cinema-hero-deck">Ocho lugares. Ocho formas de mirar una ciudad que nunca terminó de escribirse.</p>
        </div>
        <div class="cinema-hero-index" aria-hidden="true"><span>1186</span><i></i><span>HOY</span></div>
        <a class="cinema-enter" href="#muralla"><span>Comenzar el viaje</span><b aria-hidden="true">↓</b></a>
        <p class="cinema-scroll-note" aria-hidden="true">SCROLL PARA ATRAVESAR LA HISTORIA</p>
      </div>
    </section>

    <div id="story-root" class="story-root" aria-live="polite"><p class="loading-copy">Preparando el recorrido…</p></div>
  </main>
</body>
</html>
